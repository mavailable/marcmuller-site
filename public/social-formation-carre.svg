<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="glow" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#E86C47" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond -->
  <rect width="1080" height="1080" fill="#1A1A1A"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- Ligne déco gauche -->
  <rect x="72" y="90" width="3" height="900" fill="#E86C47" opacity="0.6"/>

  <!-- Badge "OFFRE LIMITÉE" -->
  <rect x="96" y="82" width="230" height="38" rx="19" fill="#E86C47"/>
  <text x="211" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="white" text-anchor="middle" letter-spacing="2">🔥 OFFRE LIMITÉE</text>

  <!-- Titre partie 1 -->
  <text x="96" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#FAFAF8" letter-spacing="-1">Comment j'ai fait</text>

  <!-- Chiffre choc -->
  <text x="96" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="104" font-weight="900" fill="#E86C47" letter-spacing="-3">50 000€</text>
  <text x="96" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="104" font-weight="900" fill="#E86C47" letter-spacing="-3">par mois</text>

  <!-- Sous-titre -->
  <text x="96" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#FAFAF8" letter-spacing="-1">en 30 jours grâce au</text>
  <text x="96" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#FAFAF8" letter-spacing="-1">Vibe Coding</text>
  <text x="96" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#E86C47" letter-spacing="-1">avec Claude Code</text>

  <!-- Séparateur -->
  <rect x="96" y="710" width="120" height="3" fill="#E86C47"/>

  <!-- Baseline -->
  <text x="96" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#6B6B6B">Formation exclusive — 997€ seulement</text>
  <text x="96" y="800" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#4A4A4A">Certifiée par un mec dans un podcast</text>

  <!-- Note reveal -->
  <text x="96" y="920" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#3A3A3A">Pas de rooftop à Dubai. Juste un dev web indépendant,</text>
  <text x="96" y="944" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#3A3A3A">un terminal, et du café filtre.</text>

  <!-- Branding -->
  <text x="984" y="1040" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#525252" text-anchor="end" letter-spacing="0.5">marcm.fr/formation</text>

  <!-- Poisson watermark -->
  <text x="960" y="180" font-family="system-ui" font-size="96" opacity="0.06" transform="rotate(-20, 960, 180)">🐟</text>
</svg>
