<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#E86C47" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white" opacity="0.07"/>
    </pattern>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1080" height="1080" fill="#0D0D0D"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <rect width="1080" height="1080" fill="url(#glow1)"/>
  <rect width="1080" height="1080" fill="url(#glow2)"/>

  <!-- Zone bas -->
  <rect x="0" y="890" width="1080" height="190" fill="#111111"/>
  <rect x="0" y="889" width="1080" height="1" fill="#2A2A2A"/>

  <!-- Accent gauche -->
  <rect x="0" y="0" width="5" height="890" fill="#E86C47" opacity="0.9"/>
  <rect x="5" y="0" width="1075" height="2" fill="#E86C47" opacity="0.3"/>

  <!-- Badge top-left -->
  <rect x="48" y="52" width="260" height="40" rx="20" fill="#E86C47"/>
  <text x="178" y="79" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1.5">🔥 RÉSULTATS EN 30 JOURS</text>

  <!-- Stars -->
  <text x="48" y="148" font-family="system-ui,-apple-system,sans-serif" font-size="28" fill="#E86C47">★★★★★</text>
  <text x="222" y="145" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="500" fill="#6B6B6B">1 800 avis</text>

  <!-- Titre intro -->
  <text x="48" y="215" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="500" fill="#9A9A9A" letter-spacing="-0.5">Comment j'ai quitté</text>
  <text x="48" y="270" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="500" fill="#9A9A9A" letter-spacing="-0.5">mon job en</text>

  <!-- Chiffre / mot choc — sans montant -->
  <text x="540" y="430" font-family="system-ui,-apple-system,sans-serif" font-size="148" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-4" filter="url(#glow-text)">30 JOURS</text>

  <!-- Ligne séparatrice -->
  <rect x="48" y="468" width="984" height="1" fill="#2A2A2A"/>

  <!-- Sous-titre -->
  <text x="48" y="538" font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="400" fill="#CCCCCC" letter-spacing="-0.5">grâce au Vibe Coding</text>
  <text x="48" y="603" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="900" fill="#E86C47" letter-spacing="-1.5">avec Claude Code</text>

  <!-- Citation déclencheur de curiosité -->
  <rect x="48" y="648" width="984" height="2" fill="#1E1E1E"/>
  <text x="48" y="706" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="400" fill="#888" letter-spacing="-0.3">"Ce que personne ne vous dit sur l'IA</text>
  <text x="48" y="750" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="400" fill="#888" letter-spacing="-0.3">et le développement web en 2026"</text>

  <!-- Tag discret -->
  <rect x="48" y="786" width="400" height="34" rx="6" fill="#1C1C1C" stroke="#333" stroke-width="1"/>
  <text x="248" y="809" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#555" text-anchor="middle" letter-spacing="0.5">Formation — marcm.fr/formation</text>

  <!-- Séparateur MAIS -->
  <line x1="48" y1="855" x2="180" y2="855" stroke="#E86C47" stroke-width="2"/>
  <text x="190" y="861" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#E86C47" letter-spacing="3">SPOILER</text>
  <line x1="278" y1="855" x2="1032" y2="855" stroke="#333" stroke-width="1"/>

  <!-- Zone reveal -->
  <text x="48" y="940" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="#555">Pas de rooftop à Dubai. Juste un dev web indépendant,</text>
  <text x="48" y="970" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="#555">un terminal, et du café filtre.</text>

  <!-- Branding -->
  <text x="1032" y="1046" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#444" text-anchor="end" letter-spacing="0.5">marcm.fr</text>

  <!-- Poisson watermark -->
  <text x="980" y="290" font-family="system-ui,sans-serif" font-size="130" opacity="0.045" transform="rotate(-25, 980, 290)">🐟</text>
</svg>
