<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <!-- Fond principal -->
    <radialGradient id="glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#E86C47" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <!-- Grille de points -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white" opacity="0.07"/>
    </pattern>
    <!-- Ombre sur le texte chiffre -->
    <filter id="glow-text" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1080" height="1080" fill="#0D0D0D"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <rect width="1080" height="1080" fill="url(#glow1)"/>
  <rect width="1080" height="1080" fill="url(#glow2)"/>

  <!-- Bande du bas (zone reveal) -->
  <rect x="0" y="890" width="1080" height="190" fill="#111111"/>
  <rect x="0" y="889" width="1080" height="1" fill="#2A2A2A"/>

  <!-- Accent vertical gauche -->
  <rect x="0" y="0" width="5" height="890" fill="#E86C47" opacity="0.9"/>

  <!-- Accent horizontal haut -->
  <rect x="5" y="0" width="1075" height="2" fill="#E86C47" opacity="0.3"/>

  <!-- Badge TOP-LEFT -->
  <rect x="48" y="52" width="260" height="40" rx="20" fill="#E86C47"/>
  <text x="178" y="78" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1.5">🔥 OFFRE LIMITÉE</text>

  <!-- Badge prix TOP-RIGHT -->
  <rect x="820" y="52" width="212" height="40" rx="8" fill="#1E1E1E" stroke="#E86C47" stroke-width="1.5"/>
  <text x="926" y="78" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="900" fill="#E86C47" text-anchor="middle">997€</text>

  <!-- Étoiles -->
  <text x="48" y="148" font-family="system-ui,-apple-system,sans-serif" font-size="28" fill="#E86C47">★★★★★</text>
  <text x="222" y="145" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="500" fill="#6B6B6B">1 800 avis</text>

  <!-- Titre intro -->
  <text x="48" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="500" fill="#9A9A9A" letter-spacing="-0.5">Comment j'ai fait</text>

  <!-- Chiffre choc — centré, dominant -->
  <text x="540" y="370" font-family="system-ui,-apple-system,sans-serif" font-size="148" font-weight="900" fill="#E86C47" text-anchor="middle" letter-spacing="-4" filter="url(#glow-text)">50 000€</text>
  <text x="540" y="470" font-family="system-ui,-apple-system,sans-serif" font-size="68" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2" opacity="0.9">par mois</text>

  <!-- Ligne séparatrice décorative -->
  <rect x="48" y="510" width="984" height="1" fill="#2A2A2A"/>

  <!-- Bloc sous-titre -->
  <text x="48" y="580" font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="400" fill="#CCCCCC" letter-spacing="-0.5">en 30 jours grâce au</text>
  <text x="48" y="645" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-1.5">Vibe Coding</text>
  <text x="48" y="710" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="900" fill="#E86C47" letter-spacing="-1.5">avec Claude Code</text>

  <!-- Tag certifié -->
  <rect x="48" y="748" width="460" height="34" rx="6" fill="#1C1C1C" stroke="#333" stroke-width="1"/>
  <text x="278" y="771" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#555" text-anchor="middle" letter-spacing="0.5">✓  Certifiée par un mec dans un podcast</text>

  <!-- Séparateur graphique avant reveal -->
  <line x1="48" y1="815" x2="200" y2="815" stroke="#E86C47" stroke-width="2"/>
  <text x="210" y="821" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#E86C47" letter-spacing="3">MAIS</text>
  <line x1="270" y1="815" x2="1032" y2="815" stroke="#333" stroke-width="1"/>

  <!-- Zone reveal — fond légèrement distinct -->
  <text x="48" y="946" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="#666" letter-spacing="0">Pas de rooftop à Dubai. Juste un dev web indépendant,</text>
  <text x="48" y="976" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="#666" letter-spacing="0">un terminal, et du café filtre. — 490€. Livré en 7 jours.</text>

  <!-- Branding -->
  <text x="1032" y="1046" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#444" text-anchor="end" letter-spacing="0.5">marcm.fr/formation</text>

  <!-- Poisson watermark — plus visible, positionné top-right -->
  <text x="980" y="290" font-family="system-ui,sans-serif" font-size="130" opacity="0.045" transform="rotate(-25, 980, 290)">🐟</text>
</svg>
