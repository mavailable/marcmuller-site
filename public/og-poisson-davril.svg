<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Fond sombre + glow terracotta -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E86C47" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
    <!-- Noise texture via pattern -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="#1A1A1A"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Ligne déco gauche -->
  <rect x="60" y="80" width="3" height="470" fill="#E86C47" opacity="0.6"/>

  <!-- Badge "OFFRE LIMITÉE" -->
  <rect x="96" y="72" width="220" height="36" rx="18" fill="#E86C47"/>
  <text x="206" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="white" text-anchor="middle" letter-spacing="2">🔥 OFFRE LIMITÉE</text>

  <!-- Titre principal -->
  <text x="96" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FAFAF8" letter-spacing="-1">Comment j'ai fait</text>

  <!-- Chiffre en gros -->
  <text x="96" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="#E86C47" letter-spacing="-3">50 000€/mois</text>

  <!-- Sous-titre -->
  <text x="96" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FAFAF8" letter-spacing="-1">en 30 jours grâce au</text>
  <text x="96" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#FAFAF8" letter-spacing="-1">Vibe Coding <tspan fill="#E86C47">avec Claude Code</tspan></text>

  <!-- Séparateur -->
  <rect x="96" y="475" width="120" height="3" fill="#E86C47"/>

  <!-- Baseline -->
  <text x="96" y="522" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#6B6B6B" letter-spacing="0">Rejoins la formation exclusive — 997€ seulement</text>

  <!-- Branding Marc M -->
  <text x="1140" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#525252" text-anchor="end" letter-spacing="0.5">marcm.fr</text>

  <!-- Poisson discret en watermark -->
  <text x="1100" y="130" font-family="system-ui" font-size="72" opacity="0.07" transform="rotate(-15, 1100, 130)">🐟</text>
</svg>
